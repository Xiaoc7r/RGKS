spring:
  application:
    name: course-registration-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/course_registration?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:course_user}
    password: ${DB_PASSWORD:course_pass}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    time-zone: Asia/Shanghai

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
