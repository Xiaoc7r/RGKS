services:
  mysql:
    image: mysql:8.4
    container_name: course-registration-mysql
    environment:
      MYSQL_DATABASE: course_registration
      MYSQL_USER: course_user
      MYSQL_PASSWORD: course_pass
      MYSQL_ROOT_PASSWORD: root_pass
    ports:
      - "3307:3306"
    volumes:
      - course-registration-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_pass"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  course-registration-data:
